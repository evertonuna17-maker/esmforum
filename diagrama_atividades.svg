<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .act { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .lbl { font-size: 13px; text-anchor: middle; }
    .edge { stroke: #333333; stroke-width: 1.3; marker-end: url(#arrow2); fill:none; }
    .edgelbl { font-size: 11.5px; fill: #333333; }
    .start-end { fill: #333333; }
  </style>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Start -->
  <circle cx="450" cy="30" r="14" class="start-end"/>
  <text x="450" y="60" class="lbl">Início</text>

  <!-- A -->
  <rect x="290" y="80" width="320" height="50" rx="10" class="act"/>
  <text x="450" y="110" class="lbl">Usuário clica em upvote ou downvote</text>
  <line x1="450" y1="44" x2="450" y2="80" class="edge"/>

  <!-- decision -->
  <polygon points="450,150 590,225 450,300 310,225" class="act"/>
  <text x="450" y="215" class="lbl">Usuário já votou</text>
  <text x="450" y="232" class="lbl">nesta pergunta?</text>
  <line x1="450" y1="130" x2="450" y2="150" class="edge"/>

  <!-- C (não) -->
  <rect x="40" y="360" width="230" height="50" rx="10" class="act"/>
  <text x="155" y="390" class="lbl">Registrar novo voto</text>
  <path d="M310,225 C 180,260 155,300 155,360" class="edge"/>
  <text x="165" y="290" class="edgelbl">não</text>

  <!-- D (mesmo tipo) -->
  <rect x="335" y="360" width="230" height="50" rx="10" class="act"/>
  <text x="450" y="390" class="lbl">Remover voto existente</text>
  <line x1="450" y1="300" x2="450" y2="360" class="edge"/>
  <text x="460" y="330" class="edgelbl">sim, mesmo tipo</text>

  <!-- E (tipo diferente) -->
  <rect x="630" y="360" width="230" height="50" rx="10" class="act"/>
  <text x="745" y="390" class="lbl">Atualizar tipo do voto</text>
  <path d="M590,225 C 720,260 745,300 745,360" class="edge"/>
  <text x="700" y="290" class="edgelbl">sim, tipo diferente</text>

  <!-- F -->
  <rect x="290" y="470" width="320" height="50" rx="10" class="act"/>
  <text x="450" y="500" class="lbl">Recalcular saldo de votos da pergunta</text>
  <path d="M155,410 C 155,450 300,470 300,470" class="edge"/>
  <line x1="450" y1="410" x2="450" y2="470" class="edge"/>
  <path d="M745,410 C 745,450 600,470 600,470" class="edge"/>

  <!-- G -->
  <rect x="290" y="560" width="320" height="50" rx="10" class="act"/>
  <text x="450" y="590" class="lbl">Atualizar contador na interface</text>
  <line x1="450" y1="520" x2="450" y2="560" class="edge"/>

  <!-- End -->
  <line x1="450" y1="610" x2="450" y2="650" class="edge"/>
  <circle cx="450" cy="670" r="14" fill="none" stroke="#333333" stroke-width="2"/>
  <circle cx="450" cy="670" r="7" class="start-end"/>
  <text x="450" y="700" class="lbl">Fim</text>
</svg>
