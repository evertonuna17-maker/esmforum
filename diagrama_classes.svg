<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .cls-box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .cls-title { fill: #dbe9ff; stroke: #333333; stroke-width: 1.5; }
    .cls-name { font-size: 15px; font-weight: bold; text-anchor: middle; }
    .attr { font-size: 12px; }
    .rel-label { font-size: 11px; fill: #333333; }
    .mult { font-size: 11px; fill: #333333; }
    line { stroke: #333333; stroke-width: 1.3; }
  </style>

  <!-- Usuario -->
  <rect x="40" y="40" width="200" height="110" class="cls-box"/>
  <rect x="40" y="40" width="200" height="28" class="cls-title"/>
  <text x="140" y="59" class="cls-name">Usuario</text>
  <line x1="40" y1="68" x2="240" y2="68" stroke="#333333"/>
  <text x="50" y="86" class="attr">+ id_usuario: int</text>
  <text x="50" y="104" class="attr">+ nome: string</text>

  <!-- Pergunta -->
  <rect x="380" y="40" width="220" height="128" class="cls-box"/>
  <rect x="380" y="40" width="220" height="28" class="cls-title"/>
  <text x="490" y="59" class="cls-name">Pergunta</text>
  <line x1="380" y1="68" x2="600" y2="68" stroke="#333333"/>
  <text x="390" y="86" class="attr">+ id_pergunta: int</text>
  <text x="390" y="104" class="attr">+ texto: string</text>
  <text x="390" y="122" class="attr">+ id_usuario: int</text>

  <!-- Resposta -->
  <rect x="740" y="40" width="200" height="110" class="cls-box"/>
  <rect x="740" y="40" width="200" height="28" class="cls-title"/>
  <text x="840" y="59" class="cls-name">Resposta</text>
  <line x1="740" y1="68" x2="940" y2="68" stroke="#333333"/>
  <text x="750" y="86" class="attr">+ id_resposta: int</text>
  <text x="750" y="104" class="attr">+ id_pergunta: int</text>

  <!-- Voto -->
  <rect x="380" y="280" width="220" height="128" class="cls-box"/>
  <rect x="380" y="280" width="220" height="28" class="cls-title"/>
  <text x="490" y="299" class="cls-name">Voto</text>
  <line x1="380" y1="308" x2="600" y2="308" stroke="#333333"/>
  <text x="390" y="326" class="attr">+ id_voto: int</text>
  <text x="390" y="344" class="attr">+ id_pergunta: int</text>
  <text x="390" y="362" class="attr">+ id_usuario: int</text>
  <text x="390" y="380" class="attr">+ tipo: "upvote"|"downvote"</text>

  <!-- PerguntaTag -->
  <rect x="380" y="470" width="220" height="92" class="cls-box"/>
  <rect x="380" y="470" width="220" height="28" class="cls-title"/>
  <text x="490" y="489" class="cls-name">PerguntaTag</text>
  <line x1="380" y1="498" x2="600" y2="498" stroke="#333333"/>
  <text x="390" y="516" class="attr">+ id_pergunta: int</text>
  <text x="390" y="534" class="attr">+ id_tag: int</text>

  <!-- Tag -->
  <rect x="740" y="470" width="200" height="92" class="cls-box"/>
  <rect x="740" y="470" width="200" height="28" class="cls-title"/>
  <text x="840" y="489" class="cls-name">Tag</text>
  <line x1="740" y1="498" x2="940" y2="498" stroke="#333333"/>
  <text x="750" y="516" class="attr">+ id_tag: int</text>
  <text x="750" y="534" class="attr">+ nome: string</text>

  <!-- Usuario -> Pergunta -->
  <line x1="240" y1="95" x2="380" y2="95"/>
  <text x="250" y="88" class="mult">1</text>
  <text x="365" y="88" class="mult">*</text>
  <text x="270" y="112" class="rel-label">autor</text>

  <!-- Pergunta -> Resposta -->
  <line x1="600" y1="95" x2="740" y2="95"/>
  <text x="610" y="88" class="mult">1</text>
  <text x="725" y="88" class="mult">*</text>
  <text x="620" y="112" class="rel-label">possui</text>

  <!-- Pergunta -> Voto -->
  <line x1="490" y1="168" x2="490" y2="280"/>
  <text x="498" y="185" class="mult">1</text>
  <text x="498" y="273" class="mult">*</text>
  <text x="500" y="230" class="rel-label">recebe</text>

  <!-- Usuario -> Voto -->
  <line x1="140" y1="150" x2="140" y2="344" />
  <line x1="140" y1="344" x2="380" y2="344"/>
  <text x="150" y="360" class="mult">*</text>
  <text x="150" y="165" class="mult">1</text>
  <text x="160" y="330" class="rel-label">registra</text>

  <!-- Pergunta -> PerguntaTag -->
  <line x1="490" y1="408" x2="490" y2="470"/>
  <text x="498" y="425" class="mult">1</text>
  <text x="498" y="463" class="mult">*</text>

  <!-- Tag -> PerguntaTag -->
  <line x1="840" y1="470" x2="840" y2="440" />
  <line x1="840" y1="440" x2="600" y2="440" />
  <line x1="600" y1="440" x2="600" y2="516"/>
  <text x="608" y="433" class="mult">1</text>
  <text x="820" y="463" class="mult">*</text>
</svg>
