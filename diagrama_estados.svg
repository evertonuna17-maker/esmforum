<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .state { fill: #dbe9ff; stroke: #333333; stroke-width: 1.5; }
    .lbl { font-size: 14px; text-anchor: middle; font-weight: bold; }
    .edge { stroke: #333333; stroke-width: 1.3; marker-end: url(#arrow3); fill:none; }
    .edgelbl { font-size: 11px; }
    .start { fill: #333333; }
  </style>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- initial -->
  <circle cx="80" cy="270" r="10" class="start"/>
  <line x1="90" y1="270" x2="150" y2="270" class="edge"/>

  <!-- SemVoto -->
  <rect x="150" y="235" width="180" height="70" rx="14" class="state"/>
  <text x="240" y="275" class="lbl">SemVoto</text>

  <!-- Upvotada -->
  <rect x="450" y="60" width="200" height="70" rx="14" class="state"/>
  <text x="550" y="100" class="lbl">Upvotada</text>

  <!-- Downvotada -->
  <rect x="450" y="440" width="200" height="70" rx="14" class="state"/>
  <text x="550" y="480" class="lbl">Downvotada</text>

  <!-- SemVoto -> Upvotada -->
  <path d="M300,240 C 380,150 420,120 450,105" class="edge"/>
  <text x="330" y="175" class="edgelbl">clica em upvote</text>

  <!-- SemVoto -> Downvotada -->
  <path d="M300,300 C 380,400 420,440 450,455" class="edge"/>
  <text x="315" y="395" class="edgelbl">clica em downvote</text>

  <!-- Upvotada -> SemVoto (toggle) -->
  <path d="M470,130 C 400,180 320,215 320,235" class="edge"/>
  <text x="330" y="205" class="edgelbl">clica upvote de novo (toggle off)</text>

  <!-- Downvotada -> SemVoto (toggle) -->
  <path d="M470,440 C 400,395 320,325 320,305" class="edge"/>
  <text x="325" y="360" class="edgelbl">clica downvote de novo (toggle off)</text>

  <!-- Upvotada -> Downvotada -->
  <path d="M640,130 C 700,220 700,350 640,440" class="edge"/>
  <text x="660" y="285" class="edgelbl">clica em downvote</text>

  <!-- Downvotada -> Upvotada -->
  <path d="M600,440 C 560,350 560,220 600,130" class="edge"/>
  <text x="440" y="285" class="edgelbl">clica em upvote</text>
</svg>
