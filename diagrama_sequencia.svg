<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .actor-box { fill: #dbe9ff; stroke: #333333; stroke-width: 1.5; }
    .name { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .lifeline { stroke: #999999; stroke-width: 1; stroke-dasharray: 4,3; }
    .msg { stroke: #333333; stroke-width: 1.3; marker-end: url(#arrow); }
    .msgret { stroke: #333333; stroke-width: 1.3; stroke-dasharray: 4,2; marker-end: url(#arrow); }
    .msglabel { font-size: 11.5px; fill: #222222; }
    .frame { fill: none; stroke: #888888; stroke-width: 1; }
    .framelabel { font-size: 11px; fill: #555555; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="20" width="120" height="34" class="actor-box"/>
  <text x="80" y="42" class="name">Usuario</text>
  <line x1="80" y1="54" x2="80" y2="740" class="lifeline"/>

  <rect x="220" y="20" width="150" height="34" class="actor-box"/>
  <text x="295" y="42" class="name">:Frontend</text>
  <line x1="295" y1="54" x2="295" y2="740" class="lifeline"/>

  <rect x="450" y="20" width="130" height="34" class="actor-box"/>
  <text x="515" y="42" class="name">:API</text>
  <line x1="515" y1="54" x2="515" y2="740" class="lifeline"/>

  <rect x="660" y="20" width="130" height="34" class="actor-box"/>
  <text x="725" y="42" class="name">:Modelo</text>
  <line x1="725" y1="54" x2="725" y2="740" class="lifeline"/>

  <rect x="870" y="20" width="110" height="34" class="actor-box"/>
  <text x="925" y="42" class="name">:Banco</text>
  <line x1="925" y1="54" x2="925" y2="740" class="lifeline"/>

  <!-- messages -->
  <line x1="80" y1="80" x2="295" y2="80" class="msg"/>
  <text x="85" y="74" class="msglabel">clica upvote/downvote</text>

  <line x1="295" y1="115" x2="515" y2="115" class="msg"/>
  <text x="300" y="109" class="msglabel">POST /perguntas/:id/votos</text>

  <line x1="515" y1="150" x2="725" y2="150" class="msg"/>
  <text x="520" y="144" class="msglabel">registrar_voto(id_pergunta, id_usuario, tipo)</text>

  <line x1="725" y1="185" x2="925" y2="185" class="msg"/>
  <text x="730" y="179" class="msglabel">SELECT voto existente</text>

  <!-- alt frame -->
  <rect x="700" y="210" width="270" height="150" class="frame"/>
  <text x="708" y="225" class="framelabel">alt [nenhum voto existente]</text>
  <line x1="725" y1="240" x2="925" y2="240" class="msg"/>
  <text x="730" y="234" class="msglabel">INSERT novo voto</text>

  <line x1="700" y1="255" x2="970" y2="255" stroke="#888888" stroke-dasharray="3,3"/>
  <text x="708" y="268" class="framelabel">[voto existente, mesmo tipo]</text>
  <line x1="725" y1="283" x2="925" y2="283" class="msg"/>
  <text x="730" y="277" class="msglabel">DELETE voto (toggle off)</text>

  <line x1="700" y1="298" x2="970" y2="298" stroke="#888888" stroke-dasharray="3,3"/>
  <text x="708" y="311" class="framelabel">[voto existente, tipo diferente]</text>
  <line x1="725" y1="326" x2="925" y2="326" class="msg"/>
  <text x="730" y="320" class="msglabel">UPDATE voto (troca tipo)</text>

  <line x1="725" y1="395" x2="925" y2="395" class="msg"/>
  <text x="730" y="389" class="msglabel">SELECT saldo de votos</text>

  <line x1="925" y1="430" x2="725" y2="430" class="msgret"/>
  <text x="730" y="424" class="msglabel">saldo atualizado</text>

  <line x1="725" y1="465" x2="515" y2="465" class="msgret"/>
  <text x="520" y="459" class="msglabel">saldo atualizado</text>

  <line x1="515" y1="500" x2="295" y2="500" class="msgret"/>
  <text x="300" y="494" class="msglabel">200 OK {saldo}</text>

  <line x1="295" y1="535" x2="80" y2="535" class="msgret"/>
  <text x="85" y="529" class="msglabel">atualiza contador na tela</text>
</svg>
