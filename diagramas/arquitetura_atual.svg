<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .layer { fill: #f5f5f5; stroke: #999999; stroke-width: 1; stroke-dasharray: 5,3; }
    .name { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .layerlabel { font-size: 12px; font-weight: bold; fill: #555555; }
    .sub { font-size: 10.5px; text-anchor: middle; }
    .edge { stroke: #333333; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
    .edgedash { stroke: #b45309; stroke-width: 1.3; fill: none; stroke-dasharray: 4,3; marker-end: url(#arr2); }
    .lbl { font-size: 10.5px; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="cyl" markerWidth="1" markerHeight="1"/>
  </defs>

  <!-- Cliente -->
  <rect x="40" y="30" width="220" height="90" class="box"/>
  <text x="150" y="55" class="name">esmforum-react</text>
  <text x="150" y="72" class="sub">(SPA React)</text>
  <text x="150" y="90" class="sub">roda no navegador</text>

  <!-- Servidor outer -->
  <rect x="330" y="20" width="530" height="480" class="layer"/>
  <text x="345" y="42" class="layerlabel">Servidor (esmforum)</text>

  <!-- Apresentacao -->
  <rect x="350" y="55" width="490" height="70" class="box" fill="#dbe9ff"/>
  <text x="595" y="80" class="name">server.js (rotas Express) — Camada de Apresentação</text>
  <text x="595" y="98" class="sub">lê req, chama a camada de negócio, monta res.json</text>

  <!-- Negocio -->
  <rect x="350" y="150" width="230" height="90" class="box" fill="#e6f4ea"/>
  <text x="465" y="175" class="name">modelo.js</text>
  <text x="465" y="192" class="sub">regras de perguntas/respostas</text>

  <rect x="610" y="150" width="230" height="90" class="box" fill="#e6f4ea"/>
  <text x="725" y="175" class="name">voto_servico.js</text>
  <text x="725" y="192" class="sub">regra de votação</text>

  <text x="595" y="128" class="layerlabel">Camada de Negócio</text>

  <!-- Dados -->
  <rect x="350" y="270" width="230" height="90" class="box" fill="#fdecea"/>
  <text x="465" y="295" class="name">bd_utils.js</text>
  <text x="465" y="312" class="sub">acesso genérico ao SQLite</text>

  <rect x="610" y="270" width="230" height="90" class="box" fill="#fdecea"/>
  <text x="725" y="295" class="name">voto_repositorio.js</text>
  <text x="725" y="312" class="sub">acesso à tabela votos</text>

  <text x="595" y="264" class="layerlabel">Camada de Dados</text>

  <!-- SQLite cylinder -->
  <ellipse cx="595" cy="440" rx="90" ry="16" class="box"/>
  <rect x="505" y="440" width="180" height="50" class="box"/>
  <ellipse cx="595" cy="490" rx="90" ry="16" class="box"/>
  <text x="595" y="470" class="name">SQLite</text>
  <text x="595" y="486" class="sub">esmforum.db</text>

  <!-- edges -->
  <line x1="260" y1="75" x2="350" y2="88" class="edge"/>
  <text x="255" y="65" class="lbl">fetch() HTTP/JSON</text>

  <line x1="500" y1="125" x2="465" y2="150" class="edge"/>
  <line x1="700" y1="125" x2="725" y2="150" class="edge"/>

  <path d="M840,90 C 870,90 870,290 840,295" class="edgedash"/>
  <text x="845" y="200" class="lbl" fill="#b45309">chamada direta</text>
  <text x="845" y="213" class="lbl" fill="#b45309">(pula a camada</text>
  <text x="845" y="226" class="lbl" fill="#b45309">de negócio)</text>

  <line x1="465" y1="240" x2="465" y2="270" class="edge"/>
  <line x1="725" y1="240" x2="725" y2="270" class="edge"/>
  <line x1="700" y1="315" x2="580" y2="315" class="edge"/>

  <line x1="465" y1="360" x2="530" y2="440" class="edge"/>
  <line x1="725" y1="360" x2="650" y2="440" class="edge"/>
</svg>
