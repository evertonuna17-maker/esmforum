<svg viewBox="0 0 940 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .layer { fill: #f5f5f5; stroke: #999999; stroke-width: 1; stroke-dasharray: 5,3; }
    .name { font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    .sub { font-size: 10.5px; text-anchor: middle; }
    .layerlabel { font-size: 12px; font-weight: bold; fill: #555555; }
    .edge { stroke: #333333; stroke-width: 1.3; fill: none; marker-end: url(#arr3); }
    .steplbl { font-size: 10.5px; fill: #333333; }
  </style>
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Cliente -->
  <rect x="30" y="180" width="160" height="80" class="box"/>
  <text x="110" y="215" class="name">Cliente</text>
  <text x="110" y="232" class="sub">(React)</text>

  <!-- MVC group -->
  <rect x="260" y="30" width="650" height="400" class="layer"/>
  <text x="275" y="52" class="layerlabel">Backend — MVC proposto</text>

  <!-- Controller -->
  <rect x="420" y="70" width="240" height="90" class="box" fill="#dbe9ff"/>
  <text x="540" y="98" class="name">Controller</text>
  <text x="540" y="115" class="sub">PerguntaController</text>
  <text x="540" y="130" class="sub">VotoController</text>

  <!-- Model -->
  <rect x="290" y="280" width="240" height="100" class="box" fill="#e6f4ea"/>
  <text x="410" y="308" class="name">Model</text>
  <text x="410" y="325" class="sub">Pergunta, Voto</text>
  <text x="410" y="340" class="sub">(regras + acesso a dados)</text>

  <!-- View -->
  <rect x="580" y="280" width="280" height="100" class="box" fill="#fff2cc"/>
  <text x="720" y="308" class="name">View</text>
  <text x="720" y="325" class="sub">PerguntaViewFormatter</text>
  <text x="720" y="340" class="sub">VotoViewFormatter (formata o JSON)</text>

  <!-- edges -->
  <line x1="190" y1="210" x2="420" y2="115" class="edge"/>
  <text x="200" y="180" class="steplbl">1. HTTP request</text>

  <line x1="480" y1="160" x2="420" y2="280" class="edge"/>
  <text x="360" y="215" class="steplbl">2. delega a operação</text>

  <line x1="410" y1="280" x2="470" y2="165" class="edge"/>
  <text x="330" y="250" class="steplbl">3. dado/objeto de domínio</text>

  <line x1="600" y1="160" x2="680" y2="280" class="edge"/>
  <text x="620" y="215" class="steplbl">4. pede formatação</text>

  <line x1="700" y1="280" x2="620" y2="165" class="edge"/>
  <text x="700" y="250" class="steplbl">5. JSON formatado</text>

  <line x1="420" y1="130" x2="190" y2="230" class="edge"/>
  <text x="200" y="255" class="steplbl">6. HTTP response</text>
</svg>
