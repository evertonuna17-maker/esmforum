<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .cls-box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .cls-title { fill: #dbe9ff; stroke: #333333; stroke-width: 1.5; }
    .iface-title { fill: #fff2cc; stroke: #333333; stroke-width: 1.5; }
    .cls-name { font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    .stereo { font-size: 10.5px; text-anchor: middle; font-style: italic; }
    .attr { font-size: 11px; }
    .edge { stroke: #333333; stroke-width: 1.3; fill: none; }
    .lbl { font-size: 10.5px; }
  </style>
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffffff" stroke="#333333"/>
    </marker>
    <marker id="diaf" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#ffffff" stroke="#333333"/>
    </marker>
  </defs>

  <!-- Interface -->
  <rect x="330" y="20" width="240" height="80" class="cls-box"/>
  <rect x="330" y="20" width="240" height="42" class="iface-title"/>
  <text x="450" y="38" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="450" y="55" class="cls-name">IListagemPerguntas</text>
  <line x1="330" y1="62" x2="570" y2="62" stroke="#333333"/>
  <text x="340" y="80" class="attr">+ listar(): Pergunta[]</text>

  <!-- ListagemBase -->
  <rect x="60" y="180" width="220" height="70" class="cls-box"/>
  <rect x="60" y="180" width="220" height="28" class="cls-title"/>
  <text x="170" y="199" class="cls-name">ListagemBase</text>
  <line x1="60" y1="208" x2="280" y2="208" stroke="#333333"/>
  <text x="70" y="226" class="attr">+ listar(): Pergunta[]</text>

  <!-- FiltroDecorator -->
  <rect x="360" y="180" width="260" height="100" class="cls-box"/>
  <rect x="360" y="180" width="260" height="42" class="cls-title"/>
  <text x="490" y="198" class="stereo">&lt;&lt;abstract&gt;&gt;</text>
  <text x="490" y="215" class="cls-name">FiltroDecorator</text>
  <line x1="360" y1="222" x2="620" y2="222" stroke="#333333"/>
  <text x="370" y="240" class="attr">- origem: IListagemPerguntas</text>
  <text x="370" y="256" class="attr">+ listar(): Pergunta[]</text>

  <!-- FiltroPorTag -->
  <rect x="330" y="380" width="230" height="80" class="cls-box"/>
  <rect x="330" y="380" width="230" height="28" class="cls-title"/>
  <text x="445" y="399" class="cls-name">FiltroPorTag</text>
  <line x1="330" y1="408" x2="560" y2="408" stroke="#333333"/>
  <text x="340" y="424" class="attr">- tag: string</text>
  <text x="340" y="440" class="attr">+ listar(): Pergunta[]</text>

  <!-- FiltroPorPalavraChave -->
  <rect x="600" y="380" width="270" height="80" class="cls-box"/>
  <rect x="600" y="380" width="270" height="28" class="cls-title"/>
  <text x="735" y="399" class="cls-name">FiltroPorPalavraChave</text>
  <line x1="600" y1="408" x2="870" y2="408" stroke="#333333"/>
  <text x="610" y="424" class="attr">- termo: string</text>
  <text x="610" y="440" class="attr">+ listar(): Pergunta[]</text>

  <!-- Realizations -->
  <path d="M280,190 C320,150 350,110 335,62" class="edge" marker-end="url(#tri)"/>
  <path d="M490,180 C490,150 480,120 460,62" class="edge" marker-end="url(#tri)"/>

  <!-- Inheritance to concrete decorators -->
  <path d="M470,280 C460,330 460,350 450,380" class="edge" marker-end="url(#tri)"/>
  <path d="M520,280 C600,330 650,350 700,380" class="edge" marker-end="url(#tri)"/>

  <!-- self-reference aggregation origem -->
  <path d="M360,220 C300,220 300,260 360,260 C400,260 400,230 366,225" class="edge" marker-start="url(#diaf)"/>
  <text x="200" y="270" class="lbl">origem: aponta para outra IListagemPerguntas</text>
  <text x="200" y="285" class="lbl">(pode ser ListagemBase ou outro Filtro, compondo)</text>
</svg>
