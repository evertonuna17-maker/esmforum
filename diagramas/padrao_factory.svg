<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .cls-box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .cls-title { fill: #dbe9ff; stroke: #333333; stroke-width: 1.5; }
    .cls-name { font-size: 14px; font-weight: bold; text-anchor: middle; }
    .attr { font-size: 11.5px; }
    .edge { stroke: #333333; stroke-width: 1.3; fill: none; }
    .lbl { font-size: 11px; }
  </style>
  <defs>
    <marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#333333"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto">
      <path d="M0,4 L5,0 L10,4 L5,8 Z" fill="#ffffff" stroke="#333333"/>
    </marker>
  </defs>

  <!-- Factory -->
  <rect x="40" y="150" width="280" height="160" class="cls-box"/>
  <rect x="40" y="150" width="280" height="28" class="cls-title"/>
  <text x="180" y="169" class="cls-name">PerguntaViewFactory</text>
  <line x1="40" y1="178" x2="320" y2="178" stroke="#333333"/>
  <text x="50" y="196" class="attr">- modelo</text>
  <text x="50" y="212" class="attr">- votoRepositorio</text>
  <text x="50" y="228" class="attr">- tagRepositorio</text>
  <line x1="40" y1="238" x2="320" y2="238" stroke="#333333"/>
  <text x="50" y="256" class="attr">+ criarView(id_pergunta): PerguntaView</text>
  <text x="50" y="274" class="attr">+ criarViewLista(): PerguntaView[]</text>

  <!-- Dependencies -->
  <rect x="40" y="20" width="180" height="46" class="cls-box"/>
  <text x="130" y="48" class="cls-name">Modelo</text>

  <rect x="240" y="20" width="200" height="46" class="cls-box"/>
  <text x="340" y="48" class="cls-name">VotoRepositorio</text>

  <rect x="460" y="20" width="190" height="46" class="cls-box"/>
  <text x="555" y="48" class="cls-name">TagRepositorio</text>

  <line x1="130" y1="150" x2="130" y2="66" class="edge" marker-end="url(#open)"/>
  <line x1="270" y1="150" x2="340" y2="66" class="edge" marker-end="url(#open)"/>
  <line x1="300" y1="150" x2="555" y2="66" class="edge" marker-end="url(#open)"/>

  <!-- PerguntaView -->
  <rect x="500" y="150" width="260" height="160" class="cls-box"/>
  <rect x="500" y="150" width="260" height="28" class="cls-title"/>
  <text x="630" y="169" class="cls-name">PerguntaView</text>
  <line x1="500" y1="178" x2="760" y2="178" stroke="#333333"/>
  <text x="510" y="196" class="attr">+ id_pergunta</text>
  <text x="510" y="212" class="attr">+ texto</text>
  <text x="510" y="228" class="attr">+ num_respostas</text>
  <text x="510" y="244" class="attr">+ saldo_votos</text>
  <text x="510" y="260" class="attr">+ tags[]</text>

  <line x1="320" y1="230" x2="500" y2="230" class="edge" marker-end="url(#diamond)"/>
  <text x="380" y="222" class="lbl">cria</text>
</svg>
