<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000000; }
    .cls-box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .cls-title { fill: #dbe9ff; stroke: #333333; stroke-width: 1.5; }
    .iface-title { fill: #fff2cc; stroke: #333333; stroke-width: 1.5; }
    .cls-name { font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    .stereo { font-size: 10.5px; text-anchor: middle; font-style: italic; }
    .attr { font-size: 11px; }
    .edge { stroke: #333333; stroke-width: 1.3; fill: none; }
    .lbl { font-size: 11px; }
  </style>
  <defs>
    <marker id="tri2" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffffff" stroke="#333333"/>
    </marker>
    <marker id="diaf2" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#ffffff" stroke="#333333"/>
    </marker>
  </defs>

  <!-- PerguntaSujeito -->
  <rect x="40" y="60" width="280" height="130" class="cls-box"/>
  <rect x="40" y="60" width="280" height="28" class="cls-title"/>
  <text x="180" y="79" class="cls-name">PerguntaSujeito</text>
  <line x1="40" y1="88" x2="320" y2="88" stroke="#333333"/>
  <text x="50" y="106" class="attr">- observadores: IObservadorResposta[]</text>
  <line x1="40" y1="116" x2="320" y2="116" stroke="#333333"/>
  <text x="50" y="134" class="attr">+ inscrever(observador)</text>
  <text x="50" y="152" class="attr">+ notificarNovaResposta(pergunta, resposta)</text>

  <!-- Interface -->
  <rect x="480" y="60" width="300" height="90" class="cls-box"/>
  <rect x="480" y="60" width="300" height="42" class="iface-title"/>
  <text x="630" y="78" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="630" y="95" class="cls-name">IObservadorResposta</text>
  <line x1="480" y1="102" x2="780" y2="102" stroke="#333333"/>
  <text x="490" y="120" class="attr">+ notificar(pergunta, resposta)</text>

  <!-- Concrete observers -->
  <rect x="340" y="300" width="270" height="70" class="cls-box"/>
  <rect x="340" y="300" width="270" height="28" class="cls-title"/>
  <text x="475" y="319" class="cls-name">NotificadorAutorDaPergunta</text>
  <line x1="340" y1="328" x2="610" y2="328" stroke="#333333"/>
  <text x="350" y="345" class="attr">+ notificar(pergunta, resposta)</text>

  <rect x="640" y="300" width="260" height="70" class="cls-box"/>
  <rect x="640" y="300" width="260" height="28" class="cls-title"/>
  <text x="770" y="319" class="cls-name">NotificadorLogAuditoria</text>
  <line x1="640" y1="328" x2="900" y2="328" stroke="#333333"/>
  <text x="650" y="345" class="attr">+ notificar(pergunta, resposta)</text>

  <!-- edges -->
  <path d="M320,125 C400,125 400,100 480,95" class="edge" marker-end="url(#diaf2)"/>
  <text x="330" y="115" class="lbl">observadores (1..*)</text>

  <path d="M480,300 C540,220 590,160 610,150" class="edge" marker-end="url(#tri2)"/>
  <path d="M770,300 C720,220 680,160 650,150" class="edge" marker-end="url(#tri2)"/>
</svg>
